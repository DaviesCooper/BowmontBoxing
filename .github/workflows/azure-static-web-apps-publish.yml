# Manually publish the site to Azure Static Web Apps.
# Uses the deployment token secret Azure added to this repo when the Static Web
# App was linked (name pattern: AZURE_STATIC_WEB_APPS_API_TOKEN_<name>_<id>).

name: Publish to Azure Static Web Apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_ISLAND_00F047D0F }}
          repo_token: ${{ github.token }}
          action: upload
          app_location: dist
          api_location: ""
          skip_app_build: true
